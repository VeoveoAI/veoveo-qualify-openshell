[package]
name = "veoveo-qualify-openshell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-qualify-openshell"
publish = false
default-run = "veoveo-qualify-openshell"

[[bin]]
name = "veoveo-qualify-openshell"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "first-path"
path = "src/bin/first-path.rs"
required-features = ["first-path"]

[dependencies]
jsonwebtoken = { version = "=9.3.1", default-features = false, optional = true }
base64 = "=0.23.1"
anyhow = "=1.0.104"
async-trait = { version = "0.1.92", optional = true }
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
openshell-policy = { git = "https://github.com/NVIDIA/OpenShell", rev = "5a7728c304b5528e954e9ae900cf21f84e1a12b1", version = "0.0.0", optional = true }
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", rev = "5a7728c304b5528e954e9ae900cf21f84e1a12b1", version = "0.0.0", optional = true }
prost = "=0.14.4"
reqwest = { version = "=0.13.5", features = ["json", "stream", "form", "http2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = { version = "=0.30.0", features = ["connect"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "=0.14.6"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
first-path = ["dep:jsonwebtoken", "dep:openshell-sdk", "dep:openshell-policy", "dep:async-trait"]
openshell-sdk = ["dep:openshell-sdk"]
openshell-policy = ["dep:openshell-policy"]
async-trait = ["dep:async-trait"]
