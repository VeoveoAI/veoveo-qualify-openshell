# An endpointless provider profile for the qualification suite. Its static secret has
# no endpoints of its own, so it resolves only where a sandbox policy endpoint binds
# the provider through `credential_binding.provider`.
id: veoveo-qualify-bound-secret
display_name: Veoveo qualification bound secret
description: A per-run fake secret that resolves only at policy-bound endpoints
category: other
credentials:
  - name: bound_secret
    description: Per-run fake secret generated by the qualification suite
    env_vars: [QUALIFY_BOUND_SECRET]
    required: true
    auth_style: bearer
    header_name: authorization
