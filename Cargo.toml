[package]
name = "veoveo-qualify-openshell"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-qualify-openshell"
publish = false
default-run = "veoveo-qualify-openshell"

[[bin]]
name = "veoveo-qualify-openshell"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
prost = "=0.14.4"
reqwest = { version = "=0.13.5", features = ["json", "stream", "form", "http2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = { version = "=0.30.0", features = ["connect"] }
tonic = "=0.14.6"
tonic-prost = "=0.14.6"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "=0.14.6"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
